<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Web Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #0f172a;
      --bg-panel: #131d36;
      --bg-bubble: #1e293b;
      --border: #1e2d4d;
      --accent-primary: #3b82f6;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Hind Siliguri', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 280px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: all 0.3s;
      z-index: 20;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: #60a5fa;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .new-chat-btn {
      margin: 12px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .history-list { flex: 1; overflow-y: auto; padding: 10px; }
    .history-item {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
    }
    .history-item.active, .history-item:hover { background: var(--bg-bubble); color: var(--text-main); }
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-nav {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(15, 23, 42, 0.8);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-emerald);
      display: inline-block;
      margin-right: 6px;
    }
    .icon-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message-row { display: flex; gap: 10px; max-width: 800px; margin: 0 auto; width: 100%; }
    .avatar {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 0.8rem; flex-shrink: 0;
    }
    .avatar.user { background: #3b82f6; color: white; }
    .avatar.assistant { background: #10b981; color: #022c22; }
    .bubble {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .user-row .bubble { background: #1e293b; border-color: #334155; }
    pre {
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin: 8px 0;
      overflow-x: auto;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
    }
    code { font-family: 'Fira Code', monospace; background: rgba(255,255,255,0.08); padding: 2px 4px; border-radius: 4px; }
    pre code { background: none; padding: 0; }
    .input-footer {
      padding: 12px 16px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
    }
    .input-box-wrapper { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; }
    textarea {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 48px;
    }
    .send-btn {
      background: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 90%; max-width: 450px; padding: 20px;
    }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select {
      width: 100%; background: var(--bg-panel); border: 1px solid var(--border);
      color: var(--text-main); padding: 10px; border-radius: 6px; outline: none;
    }
    .save-btn { width: 100%; background: var(--accent-primary); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    @media (max-width: 768px) {
      .sidebar { position: absolute; left: -280px; height: 100%; }
      .sidebar.open { left: 0; }
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>AI Chat Client</span>
      <span style="cursor: pointer;" onclick="toggleSidebar()">✕</span>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
    <div class="history-list" id="historyList"></div>
  </aside>

  <main class="main-chat">
    <header class="top-nav">
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="icon-btn" onclick="toggleSidebar()">☰</button>
        <div style="font-size: 0.85rem;"><span class="status-dot"></span><span id="currentModelDisplay">google/gemini-2.0-flash-lite:free</span></div>
      </div>
      <button class="icon-btn" onclick="openSettings()">⚙️ Settings</button>
    </header>

    <div class="messages-container" id="messagesContainer">
      <div class="message-row">
        <div class="avatar assistant">AI</div>
        <div class="bubble">আমি প্রস্তুত! নিচের বক্সে বাংলায় যেকোনো প্রশ্ন লিখুন।</div>
      </div>
    </div>

    <footer class="input-footer">
      <div class="input-box-wrapper">
        <textarea id="promptInput" rows="1" placeholder="বাংলায় যেকোনো প্রশ্ন লিখুন..." onkeydown="handleKeyDown(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendPrompt()">পাঠান</button>
      </div>
    </footer>
  </main>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 14px; font-size: 1rem;">API কনফিগারেশন</h3>
      <div class="form-group">
        <label>OpenRouter API Key</label>
        <input type="password" id="settingApiKey" placeholder="sk-or-v1-..." />
      </div>
      <div class="form-group">
        <label>ফ্রি AI মডেল সিলেক্ট করুন</label>
        <select id="settingModel">
          <option value="google/gemini-2.0-flash-lite:free">Gemini 2.0 Flash Lite (Free & Fast)</option>
          <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Free)</option>
          <option value="deepseek/deepseek-r1:free">DeepSeek R1 (Free Reasoning)</option>
        </select>
      </div>
      <button class="save-btn" onclick="saveSettings()">Save & Connect</button>
    </div>
  </div>

  <script>
    let API_KEY = localStorage.getItem('openrouter_key') || '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';
    let MODEL = localStorage.getItem('openrouter_model') || 'google/gemini-2.0-flash-lite:free';
    let currentMessages = [];

    window.onload = () => {
      document.getElementById('settingApiKey').value = API_KEY;
      document.getElementById('settingModel').value = MODEL;
      document.getElementById('currentModelDisplay').innerText = MODEL.split('/')[1] || MODEL;
    };

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    function saveSettings() {
      API_KEY = document.getElementById('settingApiKey').value.trim();
      MODEL = document.getElementById('settingModel').value;
      localStorage.setItem('openrouter_key', API_KEY);
      localStorage.setItem('openrouter_model', MODEL);
      document.getElementById('currentModelDisplay').innerText = MODEL.split('/')[1] || MODEL;
      closeSettings();
      alert('সেটিংস সেভ হয়েছে!');
    }

    function startNewChat() {
      currentMessages = [];
      document.getElementById('messagesContainer').innerHTML = `
        <div class="message-row">
          <div class="avatar assistant">AI</div>
          <div class="bubble">নতুন চ্যাট শুরু হয়েছে। কী জানতে চান?</div>
        </div>
      `;
      if (window.innerWidth <= 768) toggleSidebar();
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    }

    function appendMessageUI(role, text) {
      const box = document.getElementById('messagesContainer');
      const row = document.createElement('div');
      row.className = `message-row ${role === 'user' ? 'user-row' : ''}`;
      
      let formatted = text.replace(/```([a-zA-Z0-9]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                          .replace(/`([^`]+)`/g, '<code>$1</code>')
                          .replace(/\n/g, '<br/>');

      row.innerHTML = `<div class="avatar ${role}">${role === 'user' ? 'U' : 'AI'}</div><div class="bubble">${formatted}</div>`;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
      return row.querySelector('.bubble');
    }

    async function sendPrompt() {
      const input = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text) return;

      appendMessageUI('user', text);
      currentMessages.push({ role: 'user', content: text });
      input.value = '';
      sendBtn.disabled = true;

      const aiBubble = appendMessageUI('assistant', 'ভাবছি...');

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.origin,
            "X-Title": "Free Claude Mobile Web"
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              {
                role: "system",
                content: "তুমি একজন বন্ধুসুলভ এআই সহকারী। যেকোনো প্রশ্নের উত্তর সবসময় স্পষ্ট, সহজ ও প্রাঞ্জল বাংলায় গুছিয়ে দেবে। শুধুমাত্র ব্যবহারকারী কোড চাইলে তখন কোড ব্লকে লিখবে, অন্যথায় সাধারণ বাংলায় প্যারাগ্রাফ আকারে উত্তর দেবে।"
              },
              ...currentMessages
            ]
          })
        });

        const data = await res.json();
        if (data.choices && data.choices[0]?.message?.content) {
          const reply = data.choices[0].message.content;
          aiBubble.innerHTML = reply.replace(/```([a-zA-Z0-9]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                                    .replace(/\n/g, '<br/>');
          currentMessages.push({ role: 'assistant', content: reply });
        } else {
          aiBubble.innerHTML = `<span style="color:var(--accent-rose)">ত্রুটি: ${data.error?.message || JSON.stringify(data)}</span>`;
        }
      } catch (err) {
        aiBubble.innerHTML = `<span style="color:var(--accent-rose)">কানেকশন এরর: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
