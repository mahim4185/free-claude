<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code Web Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #0f172a;
      --bg-panel: #131d36;
      --bg-bubble: #1e293b;
      --border: #1e2d4d;
      --border-focus: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --code-bg: #070b13;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Hind Siliguri', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }
    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #60a5fa;
    }
    .brand svg { width: 24px; height: 24px; fill: currentColor; }
    .new-chat-btn {
      margin: 14px 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.2s;
    }
    .new-chat-btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 10px 10px;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 0.88rem;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .history-item:hover, .history-item.active {
      background-color: var(--bg-bubble);
      color: var(--text-main);
    }
    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .history-del {
      opacity: 0;
      color: var(--accent-rose);
      cursor: pointer;
      padding: 2px 6px;
      transition: opacity 0.2s;
    }
    .history-item:hover .history-del { opacity: 1; }

    /* Main Area */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at 50% 0%, #17255422 0%, transparent 60%);
    }

    /* Top Nav */
    .top-nav {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
    }
    .model-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      background: var(--bg-panel);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
    }
    .nav-actions {
      display: flex;
      gap: 10px;
    }
    .icon-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-primary);
    }

    /* Messages Scroll Area */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .message-row {
      display: flex;
      gap: 14px;
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .avatar.user { background: #3b82f6; color: white; }
    .avatar.assistant { background: #10b981; color: #022c22; }

    .bubble {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .user-row .bubble {
      background: #1e293b;
      border-color: #334155;
    }

    /* Code Blocks */
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      overflow-x: auto;
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      position: relative;
    }
    code {
      font-family: 'Fira Code', monospace;
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88rem;
    }
    pre code {
      background: none;
      padding: 0;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.78rem;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 4px;
    }
    .copy-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .copy-btn:hover { background: #334155; color: #fff; }

    /* Input Footer */
    .input-footer {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
    }
    .input-box-wrapper {
      max-width: 850px;
      margin: 0 auto;
      position: relative;
    }
    textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 50px 14px 16px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      min-height: 54px;
      max-height: 200px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent-primary); }
    .send-btn {
      position: absolute;
      right: 10px;
      bottom: 14px;
      background: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 6px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .send-btn:disabled {
      background: var(--border);
      cursor: not-allowed;
    }

    /* Modal / Settings Drawer */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"], select {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }
    .save-btn {
      width: 100%;
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Mobile toggle */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        top: 0; bottom: 0; left: -280px;
      }
      .sidebar.open { left: 0; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Claude Web
      </div>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">
      + New Chat
    </button>
    <div class="history-list" id="historyList"></div>
  </aside>

  <!-- Main Chat Section -->
  <main class="main-chat">
    <header class="top-nav">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="model-badge">
          <span class="status-dot"></span>
          <span id="currentModelDisplay">claude-3-5-sonnet-20241022</span>
        </div>
      </div>
      <div class="nav-actions">
        <button class="icon-btn" onclick="openSettings()">
          ⚙️ Settings & Proxy
        </button>
      </div>
    </header>

    <div class="messages-container" id="messagesContainer">
      <div class="message-row">
        <div class="avatar assistant">AI</div>
        <div class="bubble">
          স্বাগতম! এটি <strong>free-claude-code</strong> প্রক্সি এবং Anthropic API-এর জন্য একটি স্বয়ংসম্পূর্ণ ওয়েব ইন্টারফেস।
          <br><br>
          উপরের <strong>Settings & Proxy</strong> তে ক্লিক করে আপনার লোকাল প্রক্সি URL (যেমন: <code>http://localhost:8082</code>) অথবা ক্লাউড VPS লিঙ্ক কনফিগার করতে পারেন।
        </div>
      </div>
    </div>

    <footer class="input-footer">
      <div class="input-box-wrapper">
        <textarea id="promptInput" rows="1" placeholder="আপনার প্রশ্ন বা কোড প্রম্পট লিখুন (Shift+Enter for new line)..." onkeydown="handleKeyDown(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendPrompt()">
          ➤
        </button>
      </div>
    </footer>
  </main>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1.1rem;">API & Proxy Settings</h3>
        <span style="cursor: pointer; font-size: 1.2rem;" onclick="closeSettings()">&times;</span>
      </div>
      <div class="form-group">
        <label>Backend Proxy / API Base URL</label>
        <input type="text" id="settingBaseUrl" placeholder="http://localhost:8082 or https://your-proxy.onrender.com" />
      </div>
      <div class="form-group">
        <label>API Key / Token</label>
        <input type="password" id="settingApiKey" placeholder="freecc or sk-ant-..." />
      </div>
      <div class="form-group">
        <label>Model Name</label>
        <select id="settingModel">
          <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
          <option value="claude-3-7-sonnet">Claude 3.7 Sonnet</option>
          <option value="deepseek-ai/DeepSeek-V3">DeepSeek V3 (NVIDIA/OpenRouter)</option>
          <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
        </select>
      </div>
      <button class="save-btn" onclick="saveSettings()">Save & Connect</button>
    </div>
  </div>

  <script>
    // Configuration & State
    const CONFIG = {
      baseUrl: localStorage.getItem('claude_base_url') || 'http://localhost:8082',
      apiKey: localStorage.getItem('claude_api_key') || 'freecc',
      model: localStorage.getItem('claude_model') || 'claude-3-5-sonnet-20241022'
    };

    let chatHistory = JSON.parse(localStorage.getItem('claude_sessions') || '[]');
    let currentSessionId = Date.now().toString();
    let currentMessages = [];

    // Initialize UI
    window.onload = () => {
      document.getElementById('settingBaseUrl').value = CONFIG.baseUrl;
      document.getElementById('settingApiKey').value = CONFIG.apiKey;
      document.getElementById('settingModel').value = CONFIG.model;
      document.getElementById('currentModelDisplay').innerText = CONFIG.model;
      renderHistorySidebar();
    };

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function openSettings() {
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
      CONFIG.baseUrl = document.getElementById('settingBaseUrl').value.trim() || 'http://localhost:8082';
      CONFIG.apiKey = document.getElementById('settingApiKey').value.trim() || 'freecc';
      CONFIG.model = document.getElementById('settingModel').value;

      localStorage.setItem('claude_base_url', CONFIG.baseUrl);
      localStorage.setItem('claude_api_key', CONFIG.apiKey);
      localStorage.setItem('claude_model', CONFIG.model);

      document.getElementById('currentModelDisplay').innerText = CONFIG.model;
      closeSettings();
      alert('সেটিংস সফলভাবে সংরক্ষিত হয়েছে!');
    }

    function renderHistorySidebar() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      chatHistory.forEach(session => {
        const div = document.createElement('div');
        div.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
        div.innerHTML = `
          <span class="history-title" onclick="loadSession('${session.id}')">${session.title}</span>
          <span class="history-del" onclick="deleteSession('${session.id}', event)">✕</span>
        `;
        list.appendChild(div);
      });
    }

    function startNewChat() {
      currentSessionId = Date.now().toString();
      currentMessages = [];
      document.getElementById('messagesContainer').innerHTML = `
        <div class="message-row">
          <div class="avatar assistant">AI</div>
          <div class="bubble">নতুন চ্যাট শুরু হয়েছে। আপনি কী সাহায্য চান?</div>
        </div>
      `;
      renderHistorySidebar();
      if (window.innerWidth <= 768) toggleSidebar();
    }

    function loadSession(id) {
      const session = chatHistory.find(s => s.id === id);
      if (!session) return;
      currentSessionId = id;
      currentMessages = session.messages || [];
      
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';
      currentMessages.forEach(msg => {
        appendMessageUI(msg.role, msg.content);
      });
      renderHistorySidebar();
      if (window.innerWidth <= 768) toggleSidebar();
    }

    function deleteSession(id, e) {
      e.stopPropagation();
      chatHistory = chatHistory.filter(s => s.id !== id);
      localStorage.setItem('claude_sessions', JSON.stringify(chatHistory));
      if (currentSessionId === id) startNewChat();
      else renderHistorySidebar();
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatMarkdown(text) {
      // Code blocks formatting
      text = text.replace(/```([a-zA-Z0-9]*)\n([\s\S]*?)```/g, (match, lang, code) => {
        return `<pre><div class="code-header"><span>${lang || 'code'}</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><code>${escapeHtml(code.trim())}</code></pre>`;
      });
      // Inline code
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Line breaks
      text = text.replace(/\n/g, '<br/>');
      return text;
    }

    function copyCode(btn) {
      const code = btn.parentElement.nextElementSibling.innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.innerText = 'Copied!';
        setTimeout(() => btn.innerText = 'Copy', 2000);
      });
    }

    function appendMessageUI(role, content) {
      const container = document.getElementById('messagesContainer');
      const row = document.createElement('div');
      row.className = `message-row ${role === 'user' ? 'user-row' : ''}`;
      
      row.innerHTML = `
        <div class="avatar ${role}">${role === 'user' ? 'U' : 'AI'}</div>
        <div class="bubble">${formatMarkdown(content)}</div>
      `;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
      return row.querySelector('.bubble');
    }

    async function sendPrompt() {
      const input = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text) return;

      appendMessageUI('user', text);
      currentMessages.push({ role: 'user', content: text });
      input.value = '';
      sendBtn.disabled = true;

      // Save/Update Session
      const sessionIndex = chatHistory.findIndex(s => s.id === currentSessionId);
      if (sessionIndex === -1) {
        chatHistory.unshift({
          id: currentSessionId,
          title: text.substring(0, 30) + '...',
          messages: currentMessages
        });
      } else {
        chatHistory[sessionIndex].messages = currentMessages;
      }
      localStorage.setItem('claude_sessions', JSON.stringify(chatHistory));
      renderHistorySidebar();

      const aiBubble = appendMessageUI('assistant', 'প্রসেস হচ্ছে...');

      try {
        const endpoint = CONFIG.baseUrl.replace(/\/+$/, '') + '/v1/messages';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': CONFIG.apiKey,
            'anthropic-version': '2023-06-01'
          },
          body: JSON.stringify({
            model: CONFIG.model,
            max_tokens: 2048,
            messages: currentMessages
          })
        });

        const data = await res.json();
        if (data.content && data.content[0]?.text) {
          const reply = data.content[0].text;
          aiBubble.innerHTML = formatMarkdown(reply);
          currentMessages.push({ role: 'assistant', content: reply });
          localStorage.setItem('claude_sessions', JSON.stringify(chatHistory));
        } else {
          aiBubble.innerHTML = `<span style="color: #f43f5e;">রেসপন্স ত্রুটি: ${escapeHtml(JSON.stringify(data))}</span>`;
        }
      } catch (err) {
        aiBubble.innerHTML = `<span style="color: #f43f5e;">সার্ভার কানেকশন এরর: ${err.message}</span><br/><small style="color: #94a3b8;">টিপস: লোকাল সার্ভার চালু আছে কিনা বা CORS অনুমতি দেওয়া আছে কিনা পরীক্ষা করুন।</small>`;
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
